# Send a finished iOS build to TestFlight. Runs on Expo's servers using the App Store Connect
# API key assigned to the app on Expo (Credentials); the key never leaves Expo's servers. Run: eas workflow:run .eas/workflows/testflight.yml -F build_id=<id>
name: Send to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_id:
        type: string
        required: true
        description: The iOS build to upload

jobs:
  submit:
    type: submit
    environment: production
    params:
      build_id: ${{ inputs.build_id }}
      profile: production
